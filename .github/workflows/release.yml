name: Release

# Fork build: attaches a Desktop Extension (.mcpb) to a published GitHub
# Release. This fork does NOT publish to npm or to the official MCP registry —
# those namespaces belong to the upstream project (BoxLab-Ltd), and publishing
# from here would either fail or squat a namespace. Install straight from Git
# instead (see the README).
on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: 22
            - name: Verify the release manifests match the tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  MFT="$(node -p "require('./manifest.json').version")"
                  for entry in "package.json:$PKG" "manifest.json:$MFT"; do
                    name="${entry%%:*}"; ver="${entry#*:}"
                    test "$ver" = "$TAG" || {
                      echo "$name version ($ver) does not match release tag ($TAG)"; exit 1;
                    }
                  done
            - run: bun install --frozen-lockfile
            - run: bun run build
            - name: Build and attach the Desktop Extension (.mcpb)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  MCPB="yandex-metrica-mcp-${GITHUB_REF_NAME#v}.mcpb"
                  bash scripts/pack-mcpb.sh "$MCPB"
                  gh release upload "$GITHUB_REF_NAME" "$MCPB" --clobber
