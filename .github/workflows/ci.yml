name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun test
            - run: bun run build

    # Secret scan. A separate job so a leak is reported distinctly from a test
    # failure, and still runs when the build breaks. The binary is pinned and
    # checksum-verified rather than using gitleaks-action, which requires a
    # licence key for organisations and phones home.
    secrets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # Full history: a secret removed in a later commit is still
                  # in the pack and still compromised.
                  fetch-depth: 0
            - name: Install gitleaks (pinned + checksum-verified)
              env:
                  GITLEAKS_VERSION: 8.30.1
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: |
                  curl -fsSL -o gitleaks.tar.gz \
                    "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
                  tar xzf gitleaks.tar.gz gitleaks
                  ./gitleaks version
            - name: Scan the full history for secrets
              run: ./gitleaks detect --config .gitleaks.toml --redact --verbose --no-banner
